<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <title>Stufe 1 - Bolzplatz / Vereinsplatz (0-10k Plätze)</title>
  <defs>
    <linearGradient id="grass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5fa244"/>
      <stop offset="1" stop-color="#4a8835"/>
    </linearGradient>
    <pattern id="stripes" x="0" y="0" width="20" height="240" patternUnits="userSpaceOnUse">
      <rect width="10" height="240" fill="#56972d" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Wiese drumherum -->
  <rect width="360" height="240" fill="#7da659"/>

  <!-- Bäume (Vereinsplatz-Ambiente) -->
  <g>
    <circle cx="20"  cy="20"  r="8" fill="#3a6e2e"/>
    <circle cx="340" cy="20"  r="8" fill="#3a6e2e"/>
    <circle cx="20"  cy="220" r="8" fill="#3a6e2e"/>
    <circle cx="340" cy="220" r="8" fill="#3a6e2e"/>
    <circle cx="14"  cy="120" r="6" fill="#4a8e3e"/>
    <circle cx="346" cy="120" r="6" fill="#4a8e3e"/>
    <circle cx="180" cy="14"  r="5" fill="#3a6e2e"/>
    <circle cx="180" cy="226" r="5" fill="#3a6e2e"/>
  </g>

  <!-- Spielfeld - groß, klar erkennbar -->
  <g>
    <rect x="50" y="40" width="260" height="160" fill="url(#grass)"/>
    <rect x="50" y="40" width="260" height="160" fill="url(#stripes)"/>

    <!-- Außenlinie -->
    <rect x="50" y="40" width="260" height="160" fill="none" stroke="white" stroke-width="2"/>

    <!-- Mittellinie -->
    <line x1="180" y1="40" x2="180" y2="200" stroke="white" stroke-width="2"/>

    <!-- Mittelkreis + Anstoßpunkt -->
    <circle cx="180" cy="120" r="22" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="180" cy="120" r="2" fill="white"/>

    <!-- Linker Strafraum (16er) -->
    <rect x="50" y="78" width="38" height="84" fill="none" stroke="white" stroke-width="2"/>
    <!-- Linker 5er -->
    <rect x="50" y="98" width="14" height="44" fill="none" stroke="white" stroke-width="2"/>
    <!-- Linker Elfmeterpunkt -->
    <circle cx="78" cy="120" r="1.5" fill="white"/>
    <!-- Linker Strafraumbogen -->
    <path d="M 88,108 A 12,12 0 0 1 88,132" fill="none" stroke="white" stroke-width="2"/>

    <!-- Rechter Strafraum -->
    <rect x="272" y="78" width="38" height="84" fill="none" stroke="white" stroke-width="2"/>
    <rect x="296" y="98" width="14" height="44" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="282" cy="120" r="1.5" fill="white"/>
    <path d="M 272,108 A 12,12 0 0 0 272,132" fill="none" stroke="white" stroke-width="2"/>

    <!-- Eckkreise (Eckfähnchen-Bögen) -->
    <path d="M 50,46 A 6,6 0 0 0 56,40" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M 304,40 A 6,6 0 0 0 310,46" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M 50,194 A 6,6 0 0 1 56,200" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M 304,200 A 6,6 0 0 1 310,194" fill="none" stroke="white" stroke-width="1.5"/>

    <!-- Tore (Andeutung außerhalb) -->
    <rect x="44" y="108" width="6" height="24" fill="white" opacity="0.7" stroke="#666" stroke-width="0.5"/>
    <rect x="310" y="108" width="6" height="24" fill="white" opacity="0.7" stroke="#666" stroke-width="0.5"/>
    <!-- Tornetz (kleine Karos) -->
    <g stroke="#999" stroke-width="0.4" opacity="0.6">
      <line x1="44" y1="114" x2="50" y2="114"/>
      <line x1="44" y1="120" x2="50" y2="120"/>
      <line x1="44" y1="126" x2="50" y2="126"/>
      <line x1="310" y1="114" x2="316" y2="114"/>
      <line x1="310" y1="120" x2="316" y2="120"/>
      <line x1="310" y1="126" x2="316" y2="126"/>
    </g>

    <!-- Eckfähnchen (kleine rote Dreiecke) -->
    <path d="M 50,40 L 53,36 L 53,44 Z" fill="#cc4444"/>
    <path d="M 310,40 L 307,36 L 307,44 Z" fill="#cc4444"/>
    <path d="M 50,200 L 53,204 L 53,196 Z" fill="#cc4444"/>
    <path d="M 310,200 L 307,204 L 307,196 Z" fill="#cc4444"/>
  </g>

  <!-- Eine kleine Stahl-Tribüne (Längsseite, sehr klein) -->
  <g>
    <rect x="120" y="206" width="120" height="20" fill="#9aa3b6" stroke="#5d6377" stroke-width="0.6"/>
    <!-- Sitzreihen -->
    <line x1="125" y1="211" x2="235" y2="211" stroke="#5d6377" stroke-width="0.5"/>
    <line x1="125" y1="216" x2="235" y2="216" stroke="#5d6377" stroke-width="0.5"/>
    <line x1="125" y1="221" x2="235" y2="221" stroke="#5d6377" stroke-width="0.5"/>
    <!-- Stützen -->
    <line x1="130" y1="226" x2="130" y2="206" stroke="#3a3f4a" stroke-width="0.7"/>
    <line x1="180" y1="226" x2="180" y2="206" stroke="#3a3f4a" stroke-width="0.7"/>
    <line x1="230" y1="226" x2="230" y2="206" stroke="#3a3f4a" stroke-width="0.7"/>
  </g>

  <!-- Vereinshütte oben -->
  <g>
    <rect x="160" y="22" width="40" height="14" fill="#8a5a3a" stroke="#5a3a20" stroke-width="0.5"/>
    <path d="M 158,22 L 180,12 L 202,22 Z" fill="#a04030" stroke="#5a3a20" stroke-width="0.5"/>
    <rect x="174" y="28" width="6" height="8" fill="#5a3a20"/>
    <rect x="186" y="26" width="6" height="5" fill="#88aacc" opacity="0.7"/>
  </g>
</svg>
