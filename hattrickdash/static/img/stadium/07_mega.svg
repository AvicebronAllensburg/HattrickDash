<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <title>Stufe 7 - Mega-Stadion (60k+ Plätze)</title>
  <defs>
    <linearGradient id="grass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5fa244"/>
      <stop offset="1" stop-color="#4a8835"/>
    </linearGradient>
    <pattern id="stripes" x="0" y="0" width="20" height="240" patternUnits="userSpaceOnUse">
      <rect width="10" height="240" fill="#56972d" opacity="0.35"/>
    </pattern>
    <linearGradient id="standOuter" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5e6480"/>
      <stop offset="1" stop-color="#2c3548"/>
    </linearGradient>
    <linearGradient id="seatBlue" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3d6cc4"/>
      <stop offset="1" stop-color="#244d9c"/>
    </linearGradient>
    <linearGradient id="seatRed" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#cc4444"/>
      <stop offset="1" stop-color="#a02222"/>
    </linearGradient>
    <linearGradient id="roofTop" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aab2c5"/>
    </linearGradient>
    <radialGradient id="lightGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7bf" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff7bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Außen (Nacht) -->
  <rect width="360" height="240" fill="#0e1320"/>

  <!-- Sockel-Promenade -->
  <rect x="0" y="0" width="360" height="240" fill="url(#standOuter)"/>

  <!-- Sitze (3 Tiers, abwechselnd Blau/Rot wie modernes Stadion) -->
  <!-- Oben - 3 Tiers übereinander -->
  <rect x="20" y="2"  width="320" height="10" fill="url(#seatBlue)" opacity="0.85"/>
  <rect x="20" y="14" width="320" height="12" fill="url(#seatRed)" opacity="0.85"/>
  <rect x="20" y="28" width="320" height="14" fill="url(#seatBlue)" opacity="0.85"/>
  <!-- Unten - 3 Tiers -->
  <rect x="20" y="198" width="320" height="14" fill="url(#seatBlue)" opacity="0.85"/>
  <rect x="20" y="214" width="320" height="12" fill="url(#seatRed)" opacity="0.85"/>
  <rect x="20" y="228" width="320" height="10" fill="url(#seatBlue)" opacity="0.85"/>
  <!-- Links/Rechts - 3 Tiers -->
  <rect x="2"   y="20" width="10" height="200" fill="url(#seatBlue)" opacity="0.85"/>
  <rect x="14"  y="20" width="12" height="200" fill="url(#seatRed)" opacity="0.85"/>
  <rect x="28"  y="20" width="14" height="200" fill="url(#seatBlue)" opacity="0.85"/>
  <rect x="320" y="20" width="14" height="200" fill="url(#seatBlue)" opacity="0.85"/>
  <rect x="336" y="20" width="12" height="200" fill="url(#seatRed)" opacity="0.85"/>
  <rect x="350" y="20" width="10" height="200" fill="url(#seatBlue)" opacity="0.85"/>
  <!-- Sitzreihen feine Linien -->
  <g stroke="#1a1f2e" stroke-width="0.3" opacity="0.6">
    <line x1="20" y1="6"  x2="340" y2="6"/>
    <line x1="20" y1="20" x2="340" y2="20"/>
    <line x1="20" y1="35" x2="340" y2="35"/>
    <line x1="20" y1="205" x2="340" y2="205"/>
    <line x1="20" y1="220" x2="340" y2="220"/>
    <line x1="20" y1="234" x2="340" y2="234"/>
    <line x1="6"   y1="20" x2="6"   y2="220"/>
    <line x1="20"  y1="20" x2="20"  y2="220"/>
    <line x1="35"  y1="20" x2="35"  y2="220"/>
    <line x1="326" y1="20" x2="326" y2="220"/>
    <line x1="340" y1="20" x2="340" y2="220"/>
    <line x1="354" y1="20" x2="354" y2="220"/>
  </g>

  <!-- Dach (komplett überdacht, weiß) -->
  <rect x="20" y="2"   width="320" height="40" fill="url(#roofTop)" stroke="#888" stroke-width="0.6" opacity="0.85"/>
  <rect x="20" y="198" width="320" height="40" fill="url(#roofTop)" stroke="#888" stroke-width="0.6" opacity="0.85"/>
  <rect x="2"  y="20"  width="40" height="200" fill="url(#roofTop)" stroke="#888" stroke-width="0.6" opacity="0.85"/>
  <rect x="320" y="20" width="40" height="200" fill="url(#roofTop)" stroke="#888" stroke-width="0.6" opacity="0.85"/>

  <!-- Dach-Speichen-Struktur (radial) -->
  <g stroke="#666" stroke-width="0.4" opacity="0.85" fill="none">
    <!-- Oben -->
    <line x1="40"  y1="40" x2="20"  y2="2"/>
    <line x1="80"  y1="40" x2="80"  y2="2"/>
    <line x1="120" y1="40" x2="120" y2="2"/>
    <line x1="160" y1="40" x2="160" y2="2"/>
    <line x1="200" y1="40" x2="200" y2="2"/>
    <line x1="240" y1="40" x2="240" y2="2"/>
    <line x1="280" y1="40" x2="280" y2="2"/>
    <line x1="320" y1="40" x2="340" y2="2"/>
    <!-- Unten -->
    <line x1="40"  y1="200" x2="20"  y2="238"/>
    <line x1="80"  y1="200" x2="80"  y2="238"/>
    <line x1="120" y1="200" x2="120" y2="238"/>
    <line x1="160" y1="200" x2="160" y2="238"/>
    <line x1="200" y1="200" x2="200" y2="238"/>
    <line x1="240" y1="200" x2="240" y2="238"/>
    <line x1="280" y1="200" x2="280" y2="238"/>
    <line x1="320" y1="200" x2="340" y2="238"/>
    <!-- Links -->
    <line x1="40" y1="40"  x2="2"  y2="20"/>
    <line x1="40" y1="80"  x2="2"  y2="80"/>
    <line x1="40" y1="120" x2="2"  y2="120"/>
    <line x1="40" y1="160" x2="2"  y2="160"/>
    <line x1="40" y1="200" x2="2"  y2="220"/>
    <!-- Rechts -->
    <line x1="320" y1="40"  x2="358" y2="20"/>
    <line x1="320" y1="80"  x2="358" y2="80"/>
    <line x1="320" y1="120" x2="358" y2="120"/>
    <line x1="320" y1="160" x2="358" y2="160"/>
    <line x1="320" y1="200" x2="358" y2="220"/>
  </g>

  <!-- Glanz/Highlight auf Dach -->
  <rect x="20" y="2"   width="320" height="3" fill="#fff" opacity="0.7"/>
  <rect x="20" y="235" width="320" height="3" fill="#fff" opacity="0.4"/>

  <!-- 4 Lichtmasten in den Ecken (mit Glow) -->
  <g>
    <ellipse cx="20"  cy="20"  rx="20" ry="20" fill="url(#lightGlow)"/>
    <ellipse cx="340" cy="20"  rx="20" ry="20" fill="url(#lightGlow)"/>
    <ellipse cx="20"  cy="220" rx="20" ry="20" fill="url(#lightGlow)"/>
    <ellipse cx="340" cy="220" rx="20" ry="20" fill="url(#lightGlow)"/>
  </g>
  <g fill="#fff7bf">
    <circle cx="20"  cy="20"  r="3"/>
    <circle cx="340" cy="20"  r="3"/>
    <circle cx="20"  cy="220" r="3"/>
    <circle cx="340" cy="220" r="3"/>
  </g>

  <!-- Spielfeld (beleuchtet) -->
  <g>
    <rect x="50" y="40" width="260" height="160" fill="url(#grass)"/>
    <rect x="50" y="40" width="260" height="160" fill="url(#stripes)"/>

    <rect x="50" y="40" width="260" height="160" fill="none" stroke="white" stroke-width="2"/>
    <line x1="180" y1="40" x2="180" y2="200" stroke="white" stroke-width="2"/>
    <circle cx="180" cy="120" r="22" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="180" cy="120" r="2" fill="white"/>

    <rect x="50" y="78" width="38" height="84" fill="none" stroke="white" stroke-width="2"/>
    <rect x="50" y="98" width="14" height="44" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="78" cy="120" r="1.5" fill="white"/>
    <path d="M 88,108 A 12,12 0 0 1 88,132" fill="none" stroke="white" stroke-width="2"/>

    <rect x="272" y="78" width="38" height="84" fill="none" stroke="white" stroke-width="2"/>
    <rect x="296" y="98" width="14" height="44" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="282" cy="120" r="1.5" fill="white"/>
    <path d="M 272,108 A 12,12 0 0 0 272,132" fill="none" stroke="white" stroke-width="2"/>

    <path d="M 50,46 A 6,6 0 0 0 56,40" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M 304,40 A 6,6 0 0 0 310,46" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M 50,194 A 6,6 0 0 1 56,200" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M 304,200 A 6,6 0 0 1 310,194" fill="none" stroke="white" stroke-width="1.5"/>

    <rect x="44" y="108" width="6" height="24" fill="white" opacity="0.85" stroke="#666" stroke-width="0.5"/>
    <rect x="310" y="108" width="6" height="24" fill="white" opacity="0.85" stroke="#666" stroke-width="0.5"/>

    <path d="M 50,40 L 53,36 L 53,44 Z" fill="#cc4444"/>
    <path d="M 310,40 L 307,36 L 307,44 Z" fill="#cc4444"/>
    <path d="M 50,200 L 53,204 L 53,196 Z" fill="#cc4444"/>
    <path d="M 310,200 L 307,204 L 307,196 Z" fill="#cc4444"/>
  </g>

  <!-- Anzeigewürfel mittig oben -->
  <rect x="168" y="114" width="24" height="12" fill="#0d1018" stroke="#888" stroke-width="0.5"/>
  <rect x="170" y="116" width="20" height="4" fill="#22a722" opacity="0.85"/>
  <rect x="170" y="121" width="20" height="4" fill="#cc7a00" opacity="0.7"/>
</svg>
